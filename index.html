<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Person Company | 一人公司指南</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 60px;
        }
        .cards {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 20px;
            width: 300px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .card p {
            color: #666;
            margin-bottom: 20px;
        }
        .price {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
        }
        .lang {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .cards { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Choose Your Language</h1>
        <p class="subtitle">选择你的语言</p>
        
        <div class="cards">
            <a href="cn/" class="card">
                <div class="lang">🇨🇳</div>
                <h2>一人公司指南</h2>
                <p>31个真实AI赚钱案例<br>手把手教你月入过万</p>
                <div class="price" style="color: #ff6b6b;">¥1 <span style="font-size: 1rem; color: #999; text-decoration: line-through;">¥299</span></div>
                <div style="background: #ff6b6b; color: white; padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; margin-top: 10px; display: inline-block;">早鸟价 限100名</div>
            </a>
            
            <a href="en/" class="card">
                <div class="lang">🇺🇸</div>
                <h2>One Person Company</h2>
                <p>31 Real AI Business Cases<br>Build Your $1,000+/Month Business</p>
                <div class="price" style="color: #ff6b6b;">$1 <span style="font-size: 1rem; color: #999; text-decoration: line-through;">$49</span></div>
                <div style="background: #ff6b6b; color: white; padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; margin-top: 10px; display: inline-block;">Early Bird First 100</div>
            </a>
        </div>
        
        <p style="margin-top: 60px; opacity: 0.8;">
            31 AI Business Cases | Step-by-Step Guide | 7-Day Money Back Guarantee
        </p>
    </div>
</body>
</html>
